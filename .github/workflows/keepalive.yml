name: AterBot Keepalive

on:
  schedule:
    # every 5 hours (UTC clock: 00:13, 05:13, 10:13, 15:13, 20:13)
    # off-top-of-hour minute reduces the "runs get delayed/skipped" problem GitHub has at :00
    - cron: "13 */5 * * *"
  workflow_dispatch: {}

# never let two runs overlap — two bots would fight over the same username and get kicked
concurrency:
  group: aterbot-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # STRICT cap: 4h 57m = 297 minutes
    # (GitHub's hard limit is 6h per job; 297 leaves a safety buffer and honors the requested cap)
    timeout-minutes: 297
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Run AFK bot (capped ~4h57m)
        run: npm start
        env:
          MC_HOST: indomc-lifesteal.play.hosting
          MC_PORT: "25777"
          MC_USERNAME: AterBot
